name: Build Mobile Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Capacitor Android APK
    runs-on: ubuntu-24.04  # Explicitly pins the OS to prevent version migration errors
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Runtime Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Force Generate Missing Dependencies Lock File
        run: npm install --package-lock-only

      - name: Install Core Project Dependencies
        run: npm ci

      - name: Sync Capacitor Web Assets
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build Android Debug APK Package via Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Export Compiled APK Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: NebulaEscape-Game-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
